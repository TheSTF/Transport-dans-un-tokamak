name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Installer les dépendances
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
        
      - name: Compiler et tester (ASan)
        run: |
          make asan
          make test